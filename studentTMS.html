<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=deice-width,initial-scale=1.0">
        <title>Student task management system</title>
        <link rel="stylesheet" href="studentTMS.css">
    </head>

    <body>
        <div class="container">

    <aside class="sidebar">
        <h2>TaskFlow</h2>

        <ul>
            <li>Dashboard</li>
            <li>Tasks</li>
            <li>Completed</li>
            <li>Pending</li>
            <li>Settings</li>
        </ul>
    </aside>
        
    </body>
       <main>

        <header>
            <h1>Student Dashboard</h1>
            <button>Dark Mode</button>
        </header>
               <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <h2>25</h2>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <h2>18</h2>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <h2>7</h2>
            </div>

            <div class="card">
                <h3>High Priority</h3>
                <h2>4</h2>
            </div>

        </section>
            <section class="toolbar">

            <input type="text" placeholder="Search tasks">

            <div class="filters">
                <button>All</button>
                <button>Completed</button>
                <button>Pending</button>
                <button>Priority</button>
            </div>

        </section>
          
</html>
